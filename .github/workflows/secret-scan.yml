name: 'Secret scanning (basic)'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run basic secret grep
        run: |
          set -euo pipefail
          # Patterns to scan for (add to this list as needed)
          patterns=("API_KEY" "APIKEY" "SECRET_KEY" "CLOUDFLARE" "MINIO" "AWS_SECRET_ACCESS_KEY" "PRIVATE_KEY" "BEGIN RSA PRIVATE KEY" "BEGIN PRIVATE KEY" "PASSWORD=")
          bad=0
          for p in "${patterns[@]}"; do
            if git grep -n --cached -I -- "${p}" || git grep -n -- I -- "${p}"; then
              echo "Potential secret pattern found: ${p}"
              bad=1
            fi
          done
          if [ "$bad" -eq 1 ]; then
            echo "Secret scan failed - remove secrets or move them into .env and .gitignore"
            exit 1
          fi
